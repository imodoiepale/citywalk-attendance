# The device inventory. Copy to devices.yaml and edit.
#
# `serial` must match biometric_devices.serial_no in the app exactly — that is
# the join between this file and the punch that ends up on someone's timesheet.

devices:
  # The EN-K190FTW, set to "Server-Client Mode: FkWeb" on the terminal itself.
  #
  # vendor: fkweb is the native protocol parser, written from the terminal
  # vendor's own server implementation. It is the only parser that returns the
  # JSON acknowledgement these terminals block on — with any other vendor they
  # will buffer scans and re-send them forever. Use `ebkn` only for a reader on
  # this family that pushes over HTTP rather than dialling the raw TCP port.
  - serial: ENS2025079
    label: HQ main entrance
    vendor: fkweb
    # listen = the terminal dials this gateway (preferred: works behind NAT,
    #          needs no hardware at the branch)
    # poll   = this gateway dials the terminal (requires running on the LAN)
    mode: listen
    port: 5005
    timezone: Africa/Nairobi
    # Routing hint for destination filters in destinations.yaml. The app stays
    # the authority on which branch a device really belongs to.
    branch: hq
    # null  → use whatever the firmware reports, falling back to the direction
    #         configured on the device row in the app
    # 'in'  → force every scan to a clock-in, for a reader wired as the entrance
    direction: null

  # Example of an existing ZKTeco reader migrated onto the gateway.
  # - serial: TFT500P-0042
  #   label: Branch 02 exit
  #   vendor: zkteco
  #   mode: listen
  #   timezone: Africa/Nairobi
  #   branch: branch-02
  #   direction: out
