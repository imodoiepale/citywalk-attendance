# Hostinger Docker Manager application definition for the existing VPS.
#
# That server already runs Hostinger's host-network Traefik project on 80/443.
# The labels below join its HTTPS routing; the separate 8081 publication is the
# plain-HTTP path for terminal firmware that speaks bare HTTP with no TLS at
# all. Some M82-generation firmware is neither of those: it always wraps its
# connection in TLS regardless of the URL scheme configured on the terminal's
# own menu, but only speaks TLS 1.0 with old CBC cipher suites — below
# Traefik's default minimum (TLS 1.2), and Traefik's per-router TLS options
# cannot be set from Docker labels alone (they need its separate file
# provider, which lives outside this compose file since Hostinger's Traefik is
# a pre-existing, separately-managed instance). The `legacy-tls-sidecar`
# service below terminates that TLS itself and hands the gateway plain HTTP,
# published on its own port so it bypasses Traefik entirely — same reasoning
# as why FkWeb's raw TCP port is published directly rather than routed
# through it.
#
# Port 5005 is published because that is where FkWeb terminals dial. Traefik
# terminates HTTPS for HTTP-family devices, but an FkWeb terminal speaks a raw
# TCP protocol that is not HTTP and cannot be proxied by it. The allowlist
# (STRICT_SERIALS) is what stands between that port and anyone able to reach it,
# so keep it on and keep devices.yaml accurate.

services:
  gateway:
    build:
      context: https://github.com/imodoiepale/citywalk-attendance.git#main:gateway
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-https://kntejfukhzgccmqtioag.supabase.co}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set the Supabase service-role key in Hostinger}
      GATEWAY_HTTP_PORT: 8080
      GATEWAY_TCP_PORTS: ${GATEWAY_TCP_PORTS:-5005}
      # Two-way channel: terminals in cloud/ADMS mode dial in and stay connected
      # so commands can go back down the same socket. 0 disables it.
      GATEWAY_CLOUD_PORT: ${GATEWAY_CLOUD_PORT:-7788}
      COMMAND_POLL_MS: ${COMMAND_POLL_MS:-2000}
      # Required to store any biometric credential. Templates are sealed with
      # this before they reach Postgres, so a database dump is ciphertext.
      # Without it the gateway refuses to store a captured credential.
      BIOMETRIC_TEMPLATE_KEY: ${BIOMETRIC_TEMPLATE_KEY:-}
      BIOMETRIC_TEMPLATE_KEYS_PREVIOUS: ${BIOMETRIC_TEMPLATE_KEYS_PREVIOUS:-}
      # M50 WebSocket Register/Login tokens are an HMAC of this. Without it,
      # tokens fall back to BIOMETRIC_WEBHOOK_SECRET, then to a random value
      # that changes every restart — forcing every M50 terminal to re-register
      # each time the container restarts. Not fatal, just avoidable churn.
      M50_TOKEN_SECRET: ${M50_TOKEN_SECRET:-}
      SPOOL_DIR: /var/lib/smart-sentinel/spool
      TZ: ${TZ:-Africa/Nairobi}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STRICT_SERIALS: ${STRICT_SERIALS:-true}
      ARCHIVE_RAW: ${ARCHIVE_RAW:-true}
      CAMS_AUTH_TOKEN: ${CAMS_AUTH_TOKEN:-}
      CAMS_AUTH_TOKENS: ${CAMS_AUTH_TOKENS:-}
      CAMS_SECURITY_KEY: ${CAMS_SECURITY_KEY:-}

      # Secrets referenced by destinations.yaml via auth.secretEnv. Add the
      # variable here and in Hostinger's application environment; the gateway
      # refuses to start if a destination names one that is unset.
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      PARTNER_HRMS_TOKEN: ${PARTNER_HRMS_TOKEN:-}

      # No host bind file is needed in Docker Manager. Add more entries here
      # when another terminal is commissioned.
      DEVICES_YAML: |
        devices:
          - serial: ${DEVICE_SERIAL:-ENS2025079}
            label: ${DEVICE_LABEL:-HQ main entrance}
            vendor: ${DEVICE_VENDOR:-fkweb}
            mode: listen
            port: ${DEVICE_PORT:-5005}
            timezone: ${TZ:-Africa/Nairobi}
            branch: ${DEVICE_BRANCH:-hq}
            direction: ${DEVICE_DIRECTION:-null}

      # Where scans are delivered. Uncomment a webhook block to fan out to an
      # automation or a partner; each destination keeps its own queue, so one
      # being down never delays the others.
      DESTINATIONS_YAML: |
        destinations:
          - id: supabase-primary
            type: supabase
    volumes:
      - spool:/var/lib/smart-sentinel/spool
    ports:
      - "${NATIVE_HTTP_PORT:-8081}:8080"
      - "${FKWEB_TCP_PORT:-5005}:5005"
      - "${CLOUD_TCP_PORT:-7788}:7788"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.citywalk-biometric.rule=Host(`${GATEWAY_HOSTNAME:-srv1631847.hstgr.cloud}`)"
      - "traefik.http.routers.citywalk-biometric.entrypoints=websecure"
      - "traefik.http.routers.citywalk-biometric.tls=true"
      - "traefik.http.routers.citywalk-biometric.tls.certresolver=letsencrypt"
      - "traefik.http.services.citywalk-biometric.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Only needed for M82-generation terminals that always speak TLS 1.0 with
  # old cipher suites — see the header comment. Safe to leave running even if
  # unused: nothing dials this port unless a terminal is pointed at it.
  legacy-tls-sidecar:
    build:
      context: https://github.com/imodoiepale/citywalk-attendance.git#main:gateway/deploy/legacy-tls-sidecar
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      TLS_SIDECAR_BACKEND_HOST: gateway
      TLS_SIDECAR_BACKEND_PORT: "8080"
      GATEWAY_HOSTNAME: ${GATEWAY_HOSTNAME:-srv1631847.hstgr.cloud}
      # Terminals dial the raw IP, not the hostname, so the cert needs an IP
      # SAN entry too — a DNS-only SAN fails the same way a CN-only cert
      # does for a client that connects by IP address.
      TLS_SIDECAR_EXTRA_SAN: "IP:${GATEWAY_IP:-76.13.53.26}"
    ports:
      - "${LEGACY_TLS_PORT:-8443}:8443"

volumes:
  spool:
