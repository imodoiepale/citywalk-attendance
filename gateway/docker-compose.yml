services:
  gateway:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Bind inside the container; Caddy is what faces the network.
      GATEWAY_HTTP_PORT: 8080
      SPOOL_DIR: /var/lib/smart-sentinel/spool
      DEVICES_FILE: /app/devices.yaml
    volumes:
      # The device inventory is edited on the host and read-only in here, so a
      # compromised container cannot quietly add itself a device.
      - ./devices.yaml:/app/devices.yaml:ro
      - spool:/var/lib/smart-sentinel/spool
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  spool:
  caddy_data:
  caddy_config:
